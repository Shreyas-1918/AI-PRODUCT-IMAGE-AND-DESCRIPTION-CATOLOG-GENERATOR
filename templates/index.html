<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-GENESIS | AI Catalog</title>
    <style>
        :root {
            --bg-color: #020617;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(148, 163, 184, 0.1);
            --accent: #8b5cf6;
            --accent-glow: #7c3aed;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(88, 28, 135, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.2) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeIn 1s ease-out;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            background: linear-gradient(to right, #c4b5fd, #a5f3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.2rem;
            margin-top: 10px;
        }

        /* Controls */
        .controls {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            max-width: 800px;
            margin: 0 auto 60px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(2, 6, 23, 0.5);
            border: 1px solid var(--glass-border);
            padding: 20px 25px;
            border-radius: 16px;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }

        .toggle-switch {
            width: 50px;
            height: 28px;
            background: #334155;
            border-radius: 14px;
            position: relative;
            transition: 0.3s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle.active .toggle-switch {
            background: var(--accent);
        }

        .toggle.active .toggle-switch::after {
            transform: translateX(22px);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        button:hover {
            background: var(--accent-glow);
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.6);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .save-btn {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 5px 15px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .save-btn:hover {
            background: var(--accent);
            color: white;
        }

        .save-btn.saved {
            background: var(--success);
            border-color: var(--success);
            color: white;
            cursor: default;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }

        @media (max-width: 1200px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            }
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.3s ease;
            opacity: 0;
            animation: slideUp 0.5s forwards;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: rgba(139, 92, 246, 0.3);
        }

        .card-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            background: #0f172a;
            display: block;
        }

        .card-content {
            padding: 20px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .badge.verified {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge.mismatch {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .features {
            color: var(--text-dim);
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        /* Loading Overlay */
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(139, 92, 246, 0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .log-stream {
            font-family: 'Consolas', monospace;
            color: var(--accent);
            font-size: 1.1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <div class="log-stream" id="statusText">Initializing Neural Link...</div>
    </div>

    <div class="container">
        <header>
            <h1>NEO-GENESIS</h1>
            <div class="subtitle">AI-Powered Product Catalog Generator</div>
        </header>

        <div class="controls">
            <div class="input-group">
                <input type="text" id="productInput"
                    placeholder="Describe your product vision (e.g. 'Cyberpunk Sneakers, Neon Drone')...">
            </div>
            <div class="actions">
                <div class="toggle active" id="verifyToggle" onclick="this.classList.toggle('active')">
                    <div class="toggle-switch"></div>
                    <span>AI Verification</span>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button onclick="window.open('/gallery', '_blank')"
                        style="background: transparent; border: 1px solid var(--glass-border);">Access Archives</button>
                    <button onclick="startGeneration()">GENERATE ASSETS</button>
                </div>
            </div>
        </div>

        <div class="grid" id="resultsGrid">
            <!-- Cards will be injected here -->
        </div>
    </div>

    <script>
        async function startGeneration() {
            const input = document.getElementById('productInput').value;
            if (!input) return alert("Please enter a product name.");

            const products = input.split(',').map(p => p.trim()).filter(p => p);
            const verify = document.getElementById('verifyToggle').classList.contains('active');
            const grid = document.getElementById('resultsGrid');
            const loader = document.getElementById('loader');
            const status = document.getElementById('statusText');

            grid.innerHTML = ''; // Clear previous
            loader.style.display = 'flex';

            // Batch 1: Parallel Execution (Variants 1-3)
            status.innerText = "Batch 1: Processing variants 1-3 in parallel...";
            const batch1 = [];
            for (const p of products) {
                for (let i = 1; i <= 3; i++) {
                    batch1.push(generateVariant(p, i, verify, status));
                }
            }
            await Promise.all(batch1);

            // Batch 2: Series Execution (Variants 4-5) with Delay
            status.innerText = "Batch 2: Processing variants 4-5 in series (slow mode)...";
            for (const p of products) {
                for (let i = 4; i <= 5; i++) {
                    status.innerText = `Waiting 2s before processing ${p} #${i}...`;
                    await new Promise(r => setTimeout(r, 2000)); // 2s Delay
                    await generateVariant(p, i, verify, status);
                }
            }

            loader.style.display = 'none';
        }

        async function generateVariant(product, variant, verify, statusEl) {
            statusEl.innerText = `Generating ${product} #${variant}...`;

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product, variant, verify })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                createCard(data);
            } catch (e) {
                console.error(e);
            }
        }

        function createCard(data) {
            const grid = document.getElementById('resultsGrid');

            let badgeHtml = '';
            if (data.verification.status === 'success') {
                const type = data.verification.is_match ? 'verified' : 'mismatch';
                const text = data.verification.is_match ? 'VERIFIED' : 'MISMATCH';
                const score = Math.round(data.verification.score * 100);
                badgeHtml = `<div class="badge ${type}">${text} ${score}%</div>`;
            }

            const card = document.createElement('div');
            card.className = 'card';

            // Store data for saving
            const cardId = `card-${Date.now()}-${Math.random()}`;
            window[cardId] = data;

            card.innerHTML = `
                <img src="data:image/png;base64,${data.image_b64}" class="card-image" alt="${data.product}">
                <div class="card-content">
                    <div class="card-meta">
                        <div class="card-title">${data.product} #${data.variant}</div>
                        ${badgeHtml}
                    </div>
                    <div class="features">${data.features}</div>
                    <div style="margin-top: 15px; text-align: right;">
                        <button class="save-btn" onclick="saveImage('${cardId}', this)">SAVE TO ARCHIVE</button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        }

        async function saveImage(cardId, btn) {
            if (btn.classList.contains('saved')) return;

            const data = window[cardId];
            btn.innerText = "Saving...";

            try {
                const response = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        product: data.product,
                        variant: data.variant,
                        image_b64: data.image_b64,
                        features: data.features
                    })
                });

                const res = await response.json();
                if (res.error) throw new Error(res.error);

                btn.innerText = "SAVED";
                btn.classList.add('saved');
            } catch (e) {
                console.error(e);
                btn.innerText = "ERROR";
                btn.style.borderColor = "var(--error)";
                btn.style.color = "var(--error)";
            }
        }
    </script>
</body>

</html>
